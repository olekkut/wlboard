<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272A32"/>
      <stop offset="100%" stop-color="#17191E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F81F7"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
  </defs>
  <!-- Floating keyboard frame with signature crisp white outline -->
  <rect x="8" y="22" width="112" height="84" rx="18" fill="url(#chassis)" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- Top control rail -->
  <rect x="20" y="34" width="14" height="7" rx="3.5" fill="#525866"/>
  <rect x="40" y="34" width="22" height="7" rx="3.5" fill="url(#accent)"/>
  <circle cx="101" cy="37.5" r="3.5" fill="#9AA3B2"/>
  <!-- Keycap row 1 -->
  <rect x="20" y="48" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="38" y="48" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="56" y="48" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="74" y="48" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="92" y="48" width="16" height="13" rx="3.5" fill="#505766"/>
  <!-- Keycap row 2 -->
  <rect x="20" y="65" width="18" height="13" rx="3.5" fill="#505766"/>
  <rect x="42" y="65" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="60" y="65" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="78" y="65" width="14" height="13" rx="3.5" fill="#3B404C"/>
  <rect x="96" y="65" width="12" height="13" rx="3.5" fill="#3B404C"/>
  <!-- Keycap row 3 with accent spacebar -->
  <rect x="20" y="82" width="18" height="12" rx="3.5" fill="#505766"/>
  <rect x="42" y="82" width="44" height="12" rx="4" fill="url(#accent)"/>
  <rect x="90" y="82" width="18" height="12" rx="3.5" fill="#505766"/>
</svg>
